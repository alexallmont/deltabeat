name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install Python and deltabeat dev dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --extra dev
      - name: Run unit tests
        run: |
          uv run pytest --cov=deltabeat --cov-report=term-missing tests/
      - name: Run QA checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests
      - name: Verify builds and check metadata
        run: |
          uv build
          uv tool run twine check dist/*
