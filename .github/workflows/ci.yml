name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: pip install deltabeat
      run: |
        pip install -e .[dev]
    - name: pytest with coverage
      run: |
        pytest --cov=deltabeat --cov-report=term-missing tests/
    - name: Code QA
      run: |
        ruff check .
        ruff format --check .
        mypy src tests

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Build package
      run: |
        pip install build
        python -m build
    - name: Check metadata
      run: |
        pip install twine
        twine check dist/*
